<title>Établi 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: workshop bench — tool rack on the left, green cutting mat in the centre, inspector card on the right. */
:root{
  --bg:#e9eeeb;
  --panel:#f8faf8;
  --panel-2:#e2e9e5;
  --line:#c9d4ce;
  --ink:#18231f;
  --ink-2:#51625b;
  --accent:#1d7656;
  --accent-ink:#ffffff;
  --accent-soft:#d3e9de;
  --mark:#df9a00;
  --mark-soft:#fbecc4;
  --danger:#bf3b28;
  --scene:#dde5e1;
  --hole:#7b8985;
  --shadow:0 1px 2px rgba(20,40,32,.08),0 6px 18px rgba(20,40,32,.08);
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816;--panel:#19211e;--panel-2:#212b28;--line:#33413c;--ink:#e3ece8;--ink-2:#9bb0a8;
  --accent:#4cb889;--accent-ink:#0b1512;--accent-soft:#1c3a2f;--mark:#f3b733;--mark-soft:#3b3015;
  --danger:#ff7b64;--scene:#141c19;--hole:#8b9893;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816;--panel:#19211e;--panel-2:#212b28;--line:#33413c;--ink:#e3ece8;--ink-2:#9bb0a8;
  --accent:#4cb889;--accent-ink:#0b1512;--accent-soft:#1c3a2f;--mark:#f3b733;--mark-soft:#3b3015;
  --danger:#ff7b64;--scene:#141c19;--hole:#8b9893;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:auto auto 1fr auto;
  grid-template-areas:"top top top top" "rack tree stage insp";}
#insp{width:312px}
#app.insp-left{grid-template-columns:auto auto auto 1fr;grid-template-areas:"top top top top" "insp rack tree stage"}
#app.insp-left #insp{border-left:0;border-right:1px solid var(--line)}
#rack{width:96px}
#outliner{width:260px}

/* ---------- top bar */
#top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--accent)}
#projName{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;font-weight:500;min-width:0;width:200px}
#projName:hover,#projName:focus{border-color:var(--line);background:var(--bg)}
.tb-group{display:flex;gap:4px;align-items:center}
.tb-sep{width:1px;height:24px;background:var(--line)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;white-space:nowrap;line-height:1.1}
.btn:hover{background:var(--panel-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.icon{padding:6px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.danger{color:var(--danger)}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px;min-width:260px;display:grid;gap:2px}
.menu button{text-align:left;border:0;background:transparent;border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.menu button:hover{background:var(--panel-2)}
.menu small{color:var(--ink-2)}

/* ---------- shape rack */
#rack{grid-area:rack;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px 6px 16px;display:flex;flex-direction:column;gap:6px}
.rack-title{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:8px 4px 2px}
.shape{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent;background:transparent;border-radius:9px;padding:6px 2px;font-size:11.5px;line-height:1.15;text-align:center;touch-action:none;user-select:none}
.shape:hover{background:var(--panel-2);border-color:var(--line)}
.shape svg{width:40px;height:40px}
.shape.sketch{background:var(--accent-soft);border-color:var(--accent)}

/* ---------- stage */
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--scene);overflow:hidden}
#stage canvas.gl{display:block;width:100%;height:100%;touch-action:none}
.float{position:absolute;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow);z-index:5}
#tools{top:10px;left:10px;flex-wrap:wrap;max-width:calc(100% - 200px)}
#views{top:10px;right:10px;flex-direction:column}
#views .btn{justify-content:flex-start;font-size:12px;padding:5px 8px}
#snapBox{left:10px;bottom:10px;align-items:center;padding:4px 8px;font-size:12px}
#snapBox select{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:3px 4px}
#simbar{left:50%;transform:translateX(-50%);bottom:10px;align-items:center;padding:5px 6px}
#simbar .t{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding:0 6px;min-width:58px;text-align:right}
#simbar select{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:3px 4px;font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.vsep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
#banner{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);z-index:6;background:var(--mark-soft);border:1px solid var(--mark);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
#pickHint{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:7;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow)}
#toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);max-width:min(520px,calc(100% - 24px));text-align:center;pointer-events:none;transition:opacity .2s}
#dropGhost{position:absolute;pointer-events:none;z-index:50;width:44px;height:44px;opacity:.75;transform:translate(-50%,-50%);color:var(--accent)}

/* ---------- inspector */
#insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--ink-2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--f-mono);font-size:11px;background:var(--panel-2);border-radius:9px;padding:1px 6px;margin-left:4px}
#inspBody{overflow-y:auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.row{display:grid;grid-template-columns:1fr 104px;align-items:center;gap:8px}
.row label{color:var(--ink-2);font-size:13px}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.num input{width:100%;border:0;background:transparent;padding:5px 6px;font-family:var(--f-mono);font-size:13px;text-align:right;min-width:0}
.num span{font-size:11px;color:var(--ink-2);padding-right:6px}
.field{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:5px 7px;width:100%;min-width:0}
.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.xyz .num{position:relative}
.xyz b{font-family:var(--f-mono);font-size:11px;padding-left:6px;font-weight:500}
.xyz b.x{color:#d2453a}.xyz b.y{color:#2f9a4a}.xyz b.z{color:#3a6fd8}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--mark)}
.sw-custom{width:28px;height:28px;border:0;padding:0;background:none}
.kind-head{display:flex;align-items:center;gap:10px}
.kind-head svg{width:34px;height:34px;color:var(--accent);flex:none}
.kind-head input{font-family:var(--f-display);font-weight:600;font-size:17px;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;width:100%;min-width:0}
.kind-head input:hover,.kind-head input:focus{border-color:var(--line);background:var(--bg)}
.mode2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode2 .btn{justify-content:center}
.mode2 .btn.on.hole{background:var(--panel-2);border-color:var(--ink-2)}
.info{background:var(--panel-2);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.info b{color:var(--ink);font-weight:600}
.empty{color:var(--ink-2);line-height:1.5;font-size:13px}
.empty kbd,.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--bg)}
.align-grid{display:grid;grid-template-columns:28px repeat(3,1fr);gap:4px;align-items:center}
.align-grid .btn{justify-content:center;font-size:12px;padding:5px 4px}
.align-grid b{font-family:var(--f-mono);font-size:12px}

/* joints */
.jcard{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.jcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.jhead{display:flex;align-items:center;gap:8px}
.badge{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:var(--accent-soft);color:var(--ink)}
.badge.fixe{background:var(--panel-2)}
.jname{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jsub{font-size:12px;color:var(--ink-2)}
.jslider{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center}
.jslider input[type=range]{width:100%;accent-color:var(--accent)}
.jval{font-family:var(--f-mono);font-size:12px;text-align:right}
.jform{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.jform .row{grid-template-columns:96px 1fr}
.calc{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.calc .r3{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}

#mobileInsp{display:none}

/* levels: elements marked data-min appear from that level; data-max disappear above it */
html[data-level="1"] [data-min="2"], html[data-level="1"] [data-min="3"], html[data-level="2"] [data-min="3"],
html[data-level="2"] [data-max="1"], html[data-level="3"] [data-max="1"], html[data-level="3"] [data-max="2"]{display:none!important}
.lvl{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px;gap:2px}
.lvl-lbl{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:0 6px 0 6px}
.lvl button{border:0;background:transparent;border-radius:6px;padding:5px 9px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.lvl button:hover{background:var(--panel-2);color:var(--ink)}
.lvl button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lvl .s,.lvl .m{display:none}
@media (max-width: 1600px){ .lvl .l{display:none} .lvl .m{display:inline} .lvl button{padding:5px 7px} #projName{width:130px} .brand span{display:none} }
@media (max-width: 1500px){ #bExamples span{display:none} .flow .btn:not(.primary) > span:not(.flow-b){display:none} .flow-t b{display:none} #top{gap:6px} .tb-sep{display:none} }
.menu.look{left:auto;right:0;min-width:280px;padding:12px;gap:12px}
.look h4{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.look .seg{display:flex}
.look .seg .btn{flex:1;justify-content:center;padding:6px 8px}
.look-sw{display:flex;flex-wrap:wrap;gap:8px}
.look-sw button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 8px 4px 4px;font-size:12.5px}
.look-sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.look-sw i{width:18px;height:18px;border-radius:5px;display:block}

/* outliner */
#outliner{grid-area:tree;display:none;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
html[data-level="3"] #app.with-tree #outliner{display:flex}
.tree-head{display:flex;align-items:center;gap:8px;padding:10px 8px 6px 12px}
.tree-head>svg{width:18px;height:18px;color:var(--accent)}
.tree-head b{flex:1;font-family:var(--f-display);font-weight:600;font-size:15px}
#treeClose{display:none}
.tree-mode{margin:0 12px;display:flex}
.tree-mode .btn{flex:1;justify-content:center;padding:5px 6px;font-size:12.5px}
.tree-mode .btn.on{background:var(--accent-soft);color:var(--ink)}
.tree-count{padding:8px 12px 6px;font-size:11.5px;color:var(--ink-2)}
#treeBody{flex:1;overflow:auto;padding:0 6px 16px;min-height:0}
.tr{display:flex;align-items:center;gap:5px;min-height:30px;padding:2px 4px 2px calc(4px + var(--d)*16px);border-radius:6px;cursor:default;font-size:13px;position:relative}
.tr:hover{background:var(--panel-2)}
.tr.sel{background:var(--accent-soft)}
.tr.sel-child{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.tr.off .tr-name,.tr.off .tr-ic{opacity:.45}
.tr-info{color:var(--ink-2);font-size:12px;font-style:italic}
.tr-info:hover{background:transparent}
.tr-caret,.tr-caret-sp{width:18px;height:18px;flex:none;border:0;background:transparent;padding:0;display:grid;place-items:center;color:var(--ink-2);border-radius:4px}
.tr-caret svg{width:14px;height:14px;transition:transform .15s}
.tr-caret.open svg{transform:rotate(90deg)}
.tr-caret:hover{background:var(--line)}
.tr-ic{width:18px;height:18px;flex:none}
.tr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-info .tr-name{white-space:normal}
.tr .badge{font-size:10px;padding:1px 5px;flex:none}
.tr-joint{border:0;cursor:pointer}
.tr-joint:hover{filter:brightness(.95);outline:1px solid var(--accent)}
.tr-act{display:flex;gap:1px;flex:none}
.tr-btn{width:24px;height:24px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;color:var(--ink-2);opacity:.35}
.tr:hover .tr-btn,.tr-btn.on,.tr-btn:focus-visible{opacity:1}
.tr-btn.on{color:var(--mark)}
.tr-btn:hover{background:var(--line)}
.tr-btn svg{width:15px;height:15px}
.tr-rename{flex:1;min-width:0;font-size:13px;border:1px solid var(--accent);border-radius:4px;padding:2px 4px;background:var(--bg)}
.tr-empty{padding:8px 8px;font-size:13px}
.gal-lvl{font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:1px 6px;border:1px solid var(--line);color:var(--ink-2);align-self:flex-start}
.gal-lvl.l2{border-color:var(--accent);color:var(--accent)}
.gal-lvl.l3{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.gal-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width: 1600px){ .hide-mid{display:none} .lvl-lbl{display:none} }
@media (max-width: 1100px){ #projName{width:120px} .brand span{display:none} }


/* ---------- sketch editor */
#sk{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr) 290px;grid-template-areas:"skbar skbar" "skcanvas skside" "skhint skside"}
#skbar{grid-area:skbar;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#skbar .ttl{font-family:var(--f-display);font-weight:700;font-size:18px;margin-right:6px}
.tgroup{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.tgroup .lbl{font-family:var(--f-display);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:0 4px}
.tbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;font-size:12.5px;white-space:nowrap}
.tbtn:hover{background:var(--panel-2)}
.tbtn.on{background:var(--accent);color:var(--accent-ink)}
.tbtn svg{width:17px;height:17px}
.tbtn .g{font-family:var(--f-mono);font-weight:500;width:17px;text-align:center}
#skCanvasWrap{grid-area:skcanvas;position:relative;min-width:0;min-height:0;overflow:hidden}
#skCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#skHint{grid-area:skhint;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--ink-2);min-height:38px}
#skHint b{color:var(--ink)}
#skSide{grid-area:skside;background:var(--panel);border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.status{border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.4}
.status.ok{background:var(--accent-soft)}
.status.warn{background:var(--mark-soft)}
.status.err{background:color-mix(in srgb,var(--danger) 18%,var(--panel))}
#dimEdit{position:absolute;z-index:5;width:92px;border:2px solid var(--mark);border-radius:6px;padding:4px 6px;font-family:var(--f-mono);font-size:13px;background:var(--panel);text-align:center;transform:translate(-50%,-50%)}

/* ---------- help */
#help{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;padding:16px}
#help .card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);max-width:720px;width:100%;max-height:100%;overflow:auto;padding:20px 22px;display:grid;gap:14px}
#help h2{margin:0;font-family:var(--f-display);font-size:24px}
#help .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
#help h4{margin:0 0 6px;font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
#help ul{margin:0;padding-left:18px;line-height:1.55;font-size:13.5px}


/* demo note card */
#demo{position:absolute;left:10px;top:62px;z-index:6;width:min(320px,calc(100% - 20px));max-height:calc(100% - 140px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mark);border-radius:10px;box-shadow:var(--shadow);padding:6px 6px 10px 10px;display:flex;flex-direction:column;gap:8px}
#demo.closed{padding-bottom:6px}
.demo-head{display:flex;align-items:flex-start;gap:4px}
.demo-toggle{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border:0;background:transparent;padding:2px 0;column-gap:6px}
.demo-toggle svg{width:16px;height:16px;grid-row:1 / span 2;grid-column:2;color:var(--ink-2)}
.demo-kicker{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mark)}
.demo-toggle b{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.15}
.demo-sec{padding-right:6px}
.demo-sec h4{margin:0 0 3px;font-size:12.5px;font-weight:600}
.demo-sec ul{margin:0;padding-left:17px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.demo-sec li+li{margin-top:3px}
.demo-sec b{color:var(--ink)}
.demo-more{align-self:flex-start;font-size:12.5px;padding:5px 9px}

/* gallery */
.overlay{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;padding:16px}
.gal-card-wrap{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);max-width:980px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.gal-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.gal-head>div{flex:1;min-width:0}
.gal-head h2{margin:0;font-family:var(--f-display);font-size:24px;text-wrap:balance}
.gal-head p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
#galleryBody{overflow:auto;padding:6px 20px 20px;display:flex;flex-direction:column;gap:18px}
.gal-sec h3{margin:12px 0 8px;font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.gal-card{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px}
.gal-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.gal-card>svg{width:46px;height:46px;flex:none}
.gal-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.gal-txt b{font-family:var(--f-display);font-weight:600;font-size:16px}
.gal-txt>span{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.gal-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.gal-tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--panel-2);color:var(--ink)}


/* ateliers */
html[data-ws="model"] [data-ws]:not([data-ws~="model"]), html[data-ws="check"] [data-ws]:not([data-ws~="check"]),
html[data-ws="mech"] [data-ws]:not([data-ws~="mech"]), html[data-ws="struct"] [data-ws]:not([data-ws~="struct"]){display:none!important}
#steps{grid-area:steps;display:flex;align-items:center;gap:4px;overflow-x:auto;background:var(--panel-2);border-bottom:1px solid var(--line);
  padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));scrollbar-width:thin}
.step{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:9px;padding:5px 12px 5px 6px;text-align:left;white-space:nowrap;color:var(--ink-2)}
.step:hover{background:var(--panel);border-color:var(--line);color:var(--ink)}
.step.on{background:var(--panel);border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 1px var(--accent)}
.step-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;background:var(--line);color:var(--ink);flex:none}
.step.on .step-n{background:var(--accent);color:var(--accent-ink)}
.step-t{display:flex;flex-direction:column;line-height:1.15}
.step-t b{font-family:var(--f-display);font-weight:600;font-size:15px}
.step-t small{font-size:11.5px;color:var(--ink-2)}
.step-b{font-size:11px;border-radius:9px;padding:1px 7px;background:var(--line);color:var(--ink)}
.step.todo .step-b{background:var(--mark-soft);color:var(--ink)}
.step.locked .step-b{background:transparent;border:1px dashed var(--ink-2);color:var(--ink-2)}
.step-sep{color:var(--ink-2);font-size:18px;padding:0 2px;flex:none}
.insp-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.insp-head .step-n{background:var(--accent);color:var(--accent-ink)}
.insp-head b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.1}
.insp-head small{font-size:12px;color:var(--ink-2)}

/* validation */
.vchip{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;background:var(--line);color:var(--ink)}
.v-ok .vchip,.vchip.v-ok{background:#2f9a4a;color:#fff}
.vchip.v-warn{background:var(--mark);color:#1b1404}
.vchip.v-err{background:var(--danger);color:#fff}
.vchip.v-stale{background:var(--mark-soft);color:var(--ink);border:1px solid var(--mark)}
.vchip.v-info{background:var(--accent-soft);color:var(--ink)}
.vsum{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.vsum span{display:flex;align-items:center;gap:5px}
.vlist{display:flex;flex-direction:column;gap:2px}
.vrow{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:7px;padding:6px;text-align:left;font-size:13px}
button.vrow:hover{background:var(--panel-2)}
.vrow.sel{background:var(--accent-soft)}
.vic{width:20px;height:20px;flex:none}
.vname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtri{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.vstate{display:flex;align-items:center;gap:8px;font-weight:600}
.vchecks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.vchecks li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4}
.vchecks li div{display:flex;flex-direction:column}
.vchecks li span{color:var(--ink-2)}
.cbar{height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.cbar i{display:block;height:100%;border-radius:5px}
.cbar i.c1{background:#2f9a4a}.cbar i.c2{background:var(--mark)}.cbar i.c3{background:var(--danger)}
.cleg{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2)}
.loclist{display:flex;flex-direction:column;gap:3px}
.locrow{display:flex;align-items:center;gap:8px;font-size:13px;min-height:28px}
.locrow span:nth-child(2){flex:1}
.lk{width:12px;height:12px;flex:none;display:block}
.lk-centre{background:#df9a00;transform:rotate(45deg)} .lk-base{border:2.5px solid #7d8a86;border-radius:50%} .lk-axe{background:var(--accent);border-radius:50%} .lk-face{background:#8c5ac2;transform:rotate(45deg) scale(.85)}

/* structures */
#stWrap{position:absolute;inset:0;z-index:1}
#stCanvas{display:block;width:100%;height:100%;touch-action:none}
#stTools{top:10px;left:10px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 20px)}
#stTools .btn.on{background:var(--accent-soft);border-color:var(--accent)}
#stTools[data-mod="maillage"] .st-truss{display:none}
.st-snap{display:flex;align-items:center;gap:4px;font-size:12px;padding:0 4px}
.st-snap select{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:3px 4px}
#stLegendBox{left:10px;bottom:10px;padding:6px 10px;max-width:calc(100% - 20px)}
#stLegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px}
.lg{display:flex;align-items:center;gap:6px}
.lg i{width:22px;height:5px;border-radius:3px;display:block}
.lg i.dash{background:repeating-linear-gradient(90deg,#9aa5a1 0 5px,transparent 5px 9px)}
.lg.warn{color:var(--danger);font-weight:600}
.cbar2{width:140px;height:10px;border-radius:5px;display:block}
#stHint{position:absolute;right:10px;bottom:10px;z-index:4;max-width:min(380px,40%);font-size:12px;color:var(--ink-2);background:color-mix(in srgb,var(--panel) 85%,transparent);border-radius:8px;padding:6px 10px}
.verdict{border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.verdict b{font-family:var(--f-display);font-size:18px;font-weight:600}
.verdict span{font-size:12.5px}
.verdict.v-ok{background:color-mix(in srgb,#2f9a4a 16%,var(--panel))}
.verdict.v-warn{background:var(--mark-soft)}
.verdict.v-err{background:color-mix(in srgb,var(--danger) 16%,var(--panel))}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px;align-items:baseline}
.kv span{color:var(--ink-2)}
.exlist{display:flex;flex-wrap:wrap;gap:6px}
.exlist .btn{font-size:12.5px;padding:4px 8px 4px 4px}
.exlist .btn svg{width:24px;height:24px}


/* simulation bubble */
#bubble{position:absolute;z-index:22;width:min(300px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.12),0 14px 34px rgba(0,0,0,.18);padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
#bubble::after{content:"";position:absolute;width:14px;height:14px;background:var(--panel);border:1px solid var(--line);transform:rotate(45deg)}
#bubble[data-side="bl"]::after{left:-8px;bottom:12px;border-top:0;border-right:0}
#bubble[data-side="br"]::after{right:-8px;bottom:12px;border-bottom:0;border-left:0}
#bubble[data-side="tl"]::after{left:-8px;top:12px;border-top:0;border-right:0}
#bubble[data-side="tr"]::after{right:-8px;top:12px;border-bottom:0;border-left:0}
.bub-head{display:flex;align-items:center;gap:8px}
.bub-head>svg{width:28px;height:28px;flex:none;color:var(--accent)}
.bub-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bub-t b{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.15}
.bub-t small{font-size:11.5px;color:var(--ink-2);line-height:1.3}
.bub-x{border:0;background:transparent;border-radius:6px;padding:3px;display:grid;place-items:center;color:var(--ink-2)}
.bub-x:hover{background:var(--panel-2)} .bub-x svg{width:16px;height:16px}
/* bubble: drag by its header, re-attach button once moved */
.bub-head{cursor:grab;touch-action:none;user-select:none}
#bubble.dragging{cursor:grabbing;opacity:.92}
.bub-grip{display:grid;place-items:center;color:var(--ink-3,var(--ink-2));margin:0 -4px 0 -6px;flex:none}
.bub-grip svg{width:14px;height:14px}
.bub-pin{display:none;border:0;background:transparent;border-radius:6px;padding:3px;place-items:center;color:var(--ink-2)}
.bub-pin:hover{background:var(--panel-2)} .bub-pin svg{width:15px;height:15px}
#bubble[data-side=""] .bub-pin{display:grid}
#bubble[data-side=""]::after{display:none}
#bubble::after{display:none}   /* replaced by the link line */
#bubLink{position:absolute;inset:0;width:100%;height:100%;z-index:21;pointer-events:none;overflow:visible;display:none}
#bubLink line{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
#bubLink circle{fill:var(--panel);stroke:var(--accent);stroke-width:2.5}
/* 3D structure labels (same texts as the 2D drawing) */
#st3d{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.st3l{position:absolute;left:0;top:0;white-space:nowrap;font:600 12px var(--f-mono);padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--panel) 78%,transparent)}
.st3-f{color:var(--accent)}
.st3-r{color:var(--ink-2);font-weight:500;font-size:11px}
.st3-t{color:#2f6fd6;font-size:11px} .st3-c{color:#d64035;font-size:11px}
.st3-u{width:24px;height:24px;padding:0;border:2px solid var(--mark);border-radius:50%;background:transparent}
.st3-u span{position:absolute;left:30px;top:-16px;color:var(--ink);padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--panel) 78%,transparent)}
/* see-through panels (Apparence → Panneaux). The 3D view stays visible behind them. */
:root{--glass-a:74%}
html[data-glass="leger"]{--glass-a:90%}
html[data-glass="opaque"]{--glass-a:100%}
.float,#demo,#bubble,#bubble::after{background:color-mix(in srgb,var(--panel) var(--glass-a),transparent)}
.float,#demo,#bubble{-webkit-backdrop-filter:blur(3px) saturate(1.15);backdrop-filter:blur(3px) saturate(1.15)}
html[data-glass="opaque"] .float,html[data-glass="opaque"] #demo,html[data-glass="opaque"] #bubble{-webkit-backdrop-filter:none;backdrop-filter:none}
html:not([data-glass="opaque"]) #bubble .bub-row input[type=range]{background:transparent}
.bub-chip{font-size:11px;font-weight:600;border-radius:10px;padding:2px 8px;white-space:nowrap}
.bub-chip.v-ok{background:color-mix(in srgb,#2f9a4a 18%,var(--panel));color:var(--ink)}
.bub-chip.v-warn{background:var(--mark-soft)} .bub-chip.v-err{background:color-mix(in srgb,var(--danger) 20%,var(--panel))}
.bub-actions{display:flex;gap:6px}
.bub-actions .btn{flex:1;justify-content:center;padding:8px}
.bub-params{display:flex;flex-direction:column;gap:8px}
.bub-row{display:grid;grid-template-columns:82px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.bub-row label{color:var(--ink-2)}
.bub-row input[type=range]{width:100%;accent-color:var(--accent)}
.bub-row .field{grid-column:2 / span 2}
.bub-row .bub-seg{grid-column:2 / span 2}
.bub-v{font-size:12px;min-width:58px;text-align:right}
.bub-seg{display:flex}.bub-seg .btn{flex:1;justify-content:center;padding:5px 4px;font-size:12px}
.bub-seg .btn.on{background:var(--accent-soft);border-color:var(--accent)}
.bub-note{font-size:12px;color:var(--ink-2);line-height:1.4}
.bub-read{border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
.bub-warn{grid-column:1 / -1;color:var(--danger);font-weight:600}

/* joint labels */
#jlabels{position:absolute;inset:0;z-index:4;pointer-events:none}
.jl-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.jl-lines line{stroke-width:1.6;stroke-dasharray:3 3}
.jl-lines circle{fill:var(--panel);stroke-width:2}
.jl-lines text{font:700 10px var(--f-mono)}
/* the label group: grip + layout buttons on top, labels below */
.jl-group{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:none;pointer-events:auto;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 6px;padding:4px 6px 6px;z-index:6}
.jl-group .pgrip{grid-column:1}
.jl-tools{grid-column:2;display:flex;gap:2px;justify-content:flex-start}
.jl-lay{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px;display:grid;place-items:center;color:var(--ink-2)}
.jl-lay:hover{background:var(--panel-2)} .jl-lay.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.jl-li svg{width:14px;height:14px;display:block}
.jl-body{grid-column:1 / -1;gap:6px}
#jlabels .jl-body{display:none}
.jl{pointer-events:auto;display:flex;flex-direction:row;align-items:center;gap:7px;max-width:240px;text-align:left;
  background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-left:4px solid var(--jc);border-radius:9px;padding:4px 9px 5px 6px;font-size:11.5px;line-height:1.3;color:var(--ink)}
#jlabels > .jl{position:absolute;left:0;top:0;box-shadow:var(--shadow);will-change:transform}
/* the group itself is see-through: only its buttons and the labels show */
#jlGroup.jl-group{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#jlGroup .pgrip,.jl-lay{background:color-mix(in srgb,var(--panel) 70%,transparent);border-radius:6px}
#jlGroup .pgrip{padding:2px}
.jl-body .jl{max-width:none} .jl-body .jl-tx > *{white-space:nowrap}
.jl > svg{width:18px;height:18px;flex:none;color:var(--jc)}
.jl-n{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:2px solid var(--jc);font:700 10px var(--f-mono);color:var(--jc)}
.jl-tx{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.jl b{font-family:var(--f-display);font-weight:600;font-size:13px}
.jl-tx > span{color:var(--ink-2)}
.jl .jl-m{font-style:normal;font-size:10.5px;background:var(--panel-2);border-radius:5px;padding:0 5px;margin-top:2px}
.jl.sel{box-shadow:0 0 0 2px var(--mark)}
.jl:hover{border-color:var(--jc)}
/* automatic shrinking */
#jlabels[data-sz="compact"] .jl-tx > span,#jlabels[data-sz="compact"] .jl-m{display:none}
#jlabels[data-sz="compact"] .jl b{font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#jlabels[data-sz="mini"] .jl-tx{display:none}
#jlabels[data-sz="mini"] .jl{padding:3px 5px 3px 4px;gap:4px;border-left-width:3px}
#jlabels[data-sz="mini"] .jl > svg{width:15px;height:15px}

/* axis legend and locator rows */
.axleg{display:flex;gap:12px;font-size:11.5px;font-family:var(--f-mono)}
.axleg span{display:flex;align-items:center;gap:5px}
.axleg i{width:26px;height:5px;border-radius:3px;display:block}
.locname{flex:1;display:flex;flex-direction:column;min-width:0}
.locname small{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.locbtns{display:flex;gap:1px}
.locbtns .tr-btn{opacity:.8;font-size:14px}
.locbtns .tr-btn.danger{color:var(--danger)}


/* contextual navigation */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow .btn.primary{font-weight:600}
.flow .lshort{display:none}
@media (max-width: 1100px){ .flow .lfull{display:none} .flow .lshort{display:inline} }
.flow-b{font-size:11px;border-radius:9px;padding:1px 7px;background:color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.flow .btn:not(.primary) .flow-b{background:var(--panel-2)}
.flow-t{display:flex;align-items:center;gap:7px;padding:0 6px;font-family:var(--f-display);font-size:16px;white-space:nowrap}
.flow-t .step-n{background:var(--accent);color:var(--accent-ink)}

/* movable, collapsible panels */
.pgrip{display:flex;align-items:center;gap:1px;color:var(--ink-2);cursor:grab;border-radius:6px;padding:2px 1px;touch-action:none;flex:none}
.pgrip:hover{background:var(--panel-2);color:var(--ink)}
.pgrip>svg{width:12px;height:18px}
.pmin{border:0;background:transparent;padding:3px;border-radius:5px;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.pmin:hover{background:var(--line);color:var(--ink)}
.pmin svg{width:14px;height:14px;transform:rotate(-90deg);transition:transform .15s}
.pfloat.collapsed .pmin svg{transform:rotate(90deg)}
.pfloat.collapsed > :not(.pgrip){display:none!important}
.pfloat.collapsed{padding:3px}
.dragging{opacity:.9;cursor:grabbing!important;box-shadow:0 10px 30px rgba(0,0,0,.25)!important;transition:none!important}
#views .pgrip{align-self:stretch;justify-content:space-between}
.demo-grip{align-self:center;margin-left:-4px}
.insp-tt{flex:1;min-width:0}
.insp-tool svg{width:16px;height:16px}
#inspMin svg{transform:rotate(90deg)}
#app.insp-left #inspMin svg{transform:rotate(-90deg)}
#app.insp-min #insp{width:50px}
#app.insp-min #inspBody,#app.insp-min .insp-tt,#app.insp-min #inspSide{display:none}
#app.insp-min .insp-head{flex-direction:column;padding:10px 4px;border-bottom:0}
